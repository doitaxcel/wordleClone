<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Wordle Clone</title>
    <link rel="stylesheet" href="./src/output.css">
</head>
<body class="p-0 m-0 w-full h-dvh overflow-hidden bg-[#121213] text-white">
    <div class="h-dvh w-full max-w-lg mx-auto flex flex-col justify-between items-center px-2 sm:px-4 py-2 sm:py-3">
        
        <!-- Header -->
        <header class="flex items-center justify-between w-full border-b border-neutral-700 pb-2 sm:pb-3 px-1">
            <button class="text-xs sm:text-sm font-semibold rounded-md bg-neutral-700 hover:bg-neutral-600 active:scale-95 text-neutral-200 px-3 py-1.5 transition-all"
                    id="retryBtn"
                    onclick="retryWindow()">
                New Game
            </button>

            <h1 class="font-extrabold text-lg sm:text-2xl md:text-3xl tracking-wider text-center uppercase">
                Wordle
            </h1>

            <div class="w-16"></div> <!-- Balance spacing -->
        </header>

        <!-- Retry Dialog Modal -->
        <div id="retryDialogue" class="hidden fixed inset-0 flex items-center justify-center bg-black/70 backdrop-blur-xs z-50 p-4">
            <div class="flex flex-col justify-center items-center w-full max-w-sm bg-neutral-800 border border-neutral-600 rounded-2xl text-center shadow-2xl p-5 sm:p-6">
                <h4 class="pb-2 text-lg sm:text-xl font-bold text-white">
                    Start a New Game?
                </h4>
                <p class="pb-5 text-xs sm:text-sm text-neutral-300 font-normal leading-relaxed">
                    This will restart the game and pick a new 5-letter word. Your current guess progress will be reset.
                </p>

                <div class="flex flex-row justify-center gap-3 w-full">
                    <button id="declineBtn" class="btn flex-1 bg-neutral-700 border-neutral-500 hover:bg-neutral-600">Cancel</button>
                    <button id="confirmBtn" class="btn flex-1 bg-emerald-700 border-emerald-500 hover:bg-emerald-600">Restart</button>
                </div>
            </div>
        </div>

        <!-- Board Wrapper: Fits nicely between header and keyboard -->
        <main class="flex-1 w-full flex items-center justify-center min-h-0 py-2 sm:py-3">
            <div id="board-container" class="w-full flex items-center justify-center h-full">
                <div id="board" class="grid grid-cols-5 gap-1.5 sm:gap-2 w-full max-w-[330px] aspect-[5/6] max-h-full">
                    <!-- 30 tiles dynamically generated in board.js -->
                </div>
            </div>
        </main>

        <!-- Virtual Keyboard -->
        <div class="keyboard flex flex-col items-center select-none w-full max-w-lg mt-auto">
            
            <div class="up flex w-full justify-center mb-1.5">
                <span class="key" data-key="Q">Q</span>
                <span class="key" data-key="W">W</span>
                <span class="key" data-key="E">E</span>
                <span class="key" data-key="R">R</span>
                <span class="key" data-key="T">T</span>
                <span class="key" data-key="Y">Y</span>
                <span class="key" data-key="U">U</span>
                <span class="key" data-key="I">I</span>
                <span class="key" data-key="O">O</span>
                <span class="key" data-key="P">P</span>
            </div>

            <div class="mid flex w-full justify-center mb-1.5 px-3">
                <span class="key" data-key="A">A</span>
                <span class="key" data-key="S">S</span>
                <span class="key" data-key="D">D</span>
                <span class="key" data-key="F">F</span>
                <span class="key" data-key="G">G</span>
                <span class="key" data-key="H">H</span>
                <span class="key" data-key="J">J</span>
                <span class="key" data-key="K">K</span>
                <span class="key" data-key="L">L</span>
            </div>

            <div class="bot flex w-full justify-center mb-1">
                <span class="key" data-key="Enter">ENTER</span>
                <span class="key" data-key="Z">Z</span>
                <span class="key" data-key="X">X</span>
                <span class="key" data-key="C">C</span>
                <span class="key" data-key="V">V</span>
                <span class="key" data-key="B">B</span>
                <span class="key" data-key="N">N</span>
                <span class="key" data-key="M">M</span>
                <span class="key" data-key="Backspace">⌫</span>
            </div>
        </div>

    </div>
    <script src="board.js"></script>
</body>
</html>
